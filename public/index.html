<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Hari Singh Gour University Campus Bus Tracker</title>
  <link rel="manifest" href="/manifest.json" />

  <!-- Leaflet's CSS — needed for the map to actually LOOK like a map, not a broken grid -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #status {
      padding: 10px 16px; background: #1a1a1a; color: #fff;
      font-size: 14px; display: flex; justify-content: space-between; align-items: center;
    }
    #status span.dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; margin-right: 6px;
    }
    #refreshBtn {
      background: #333; color: #fff; border: none; border-radius: 6px;
      width: 32px; height: 32px; font-size: 16px; cursor: pointer; margin-left: 10px;
    }
    #refreshBtn:active { background: #555; }
    #map { height: calc(100vh - 72px); width: 100%; }

    #wakeOverlay {
     position: fixed; inset: 0; background: #1a1a1a; color: #fff;
     display: flex; align-items: center; justify-content: center; z-index: 1000;
     transition: opacity 0.4s ease;
    }
    #wakeOverlay.hidden { opacity: 0; pointer-events: none; }
    .wake-content { text-align: center; padding: 20px; }
    .wake-bus { font-size: 48px; animation: bounce 1.2s infinite ease-in-out; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .wake-text { font-size: 16px; font-weight: 600; margin-top: 14px; }
    .wake-subtext { font-size: 13px; color: #999; margin-top: 6px; max-width: 260px; }
  </style>
</head>
<body>
  <div style="padding: 10px 16px; background:#1a1a1a; color:#fff; font-weight:600; font-size:15px; text-align:center;">
  🚌 Dr. Hari Singh Gour University Campus Bus Tracker
  </div>
  <div id="wakeOverlay">
    <div class="wake-content">
      <div class="wake-bus">🚌</div>
      <div class="wake-text">Bus Tracker is waking up...</div>
      <div class="wake-subtext">This may take a few seconds. Please keep this tab open.</div>
    </div>
  </div>
  <div id="status"> </div>
  <div id="distanceInfo" style="font-size:13px; color:#93c5fd; margin-top: 2px;" ></div>
    <div><span class="dot" id="connectionDot"></span><span id="connectionText">Live tracking</span></div>
    <div id="busInfo">Waiting for signal...</div>
    <button id="refreshBtn" title="Force refresh">&#8635;</button>
  </div>
  <div id="map"></div>

  <!-- Leaflet's JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Socket.IO client — auto-served by our server at this exact path -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // --- Set up the map, centered roughly on the placeholder coordinates ---
    const map = L.map("map").setView([23.826753729896605, 78.77189619772187], 16);

    // The actual map tiles (the visual map imagery) come from OpenStreetMap — free, no API key.
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // A custom bus icon so it doesn't look like a generic map pin
    const busIcon = L.divIcon({
      html: "🚌",
      className: "bus-emoji-icon",
      iconSize: [30, 30],
    });

    let busMarker = null;
    let studentMarker = null;
    let latestBusData = null;
    const connectionDot = document.getElementById("connectionDot");
    const connectionText = document.getElementById("connectionText");
    const busInfo = document.getElementById("busInfo");
    const distanceInfo = document.getElementById("distanceInfo");

function haversineDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) *
      Math.cos((lat2 * Math.PI) / 180) *
      Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function updateDistanceDisplay() {
  if (!latestBusData || !studentMarker) return;
  const studentPos = studentMarker.getLatLng();
  const distanceKm = haversineDistanceKm(latestBusData.lat, latestBusData.lng, studentPos.lat, studentPos.lng);
  const distanceM = Math.round(distanceKm * 1000);
  let etaText = "";
  if (latestBusData.status === "moving" && latestBusData.speedKmh > 1) {
    const etaMinutes = (distanceKm / latestBusData.speedKmh) * 60;
    etaText = ` · ETA ~${Math.max(1, Math.round(etaMinutes))} min`;
  }
  const distanceText = distanceM < 1000 ? `${distanceM}m away` : `${(distanceM/1000).toFixed(1)}km away`;
  distanceInfo.textContent = `🚏 Bus is ${distanceText}${etaText}`;
}

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    (position) => {
      const { latitude, longitude } = position.coords;
      if (!studentMarker) {
        const studentIcon = L.divIcon({
          html: '<div style="width:14px;height:14px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,0.4);"></div>',
          className: "",
          iconSize: [14, 14],
        });
        studentMarker = L.marker([latitude, longitude], { icon: studentIcon }).addTo(map);
      } else {
        studentMarker.setLatLng([latitude, longitude]);
      }
      updateDistanceDisplay();
    },
    () => { distanceInfo.textContent = ""; },
    { enableHighAccuracy: true }
  );
}

    // --- Connect to the server's real-time channel ---
    const socket = io();

    const wakeOverlay = document.getElementById("wakeOverlay");

    socket.on("connect", () => {
    connectionDot.style.background = "#22c55e"; // green
    connectionText.textContent = "Live tracking";
    wakeOverlay.classList.add("hidden"); // hide the "waking up" screen once truly connected
    });

    socket.on("disconnect", () => {
      connectionDot.style.background = "#ef4444"; // red
      connectionText.textContent = "Disconnected — reconnecting...";
    });

    socket.on("busLocation", (data) => {
      const { lat, lng, lastUpdated, speedKmh, status } = data;
      latestBusData = data;

      if (!busMarker) {
        busMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map);
      } else {
        busMarker.setLatLng([lat, lng]);
      }

      const secondsAgo = Math.round((Date.now() - lastUpdated) / 1000);
      const timeText = secondsAgo <= 1 ? "just now" : `${secondsAgo}s ago`;
      const statusEmoji = status === "moving" ? "🟢 Moving" : "🟡 Stopped";
      const speedText = status === "moving" ? ` · ${speedKmh} km/h` : "";

      busInfo.textContent = `${statusEmoji}${speedText} · Updated ${timeText}`;
    });
    updateDistanceDisplay();

    // Manual refresh button — forces a fresh reconnect + re-fetch of the current position.
    // Mainly useful as a fallback if a tab was backgrounded and needs a nudge.
    document.getElementById("refreshBtn").addEventListener("click", () => {
      socket.disconnect();
      socket.connect();
    });
    if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js").catch((err) => {
    console.log("Service worker registration failed:", err);
  });
}
  </script>


  

</body>
</html>

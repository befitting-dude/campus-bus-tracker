<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard — Dr. Hari Singh Gour University Campus Bus Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px;
    }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .top-bar h1 { font-size: 17px; margin: 0; }
    .back-link {
      color: var(--accent-light); text-decoration: none; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .kpi-card { background: var(--card-bg); border-radius: 14px; padding: 14px; border: 1px solid rgba(255,255,255,0.06); }
    .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    .kpi-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text-dim); margin: 22px 0 10px; text-transform: uppercase; letter-spacing: 0.4px; }
    .chart-card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); }
    .event-list { display: flex; flex-direction: column; gap: 8px; }
    .event-row {
      background: var(--card-bg); border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.06); font-size: 13px;
    }
    .event-role { font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .event-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .event-badge.connected { background: rgba(34,197,94,0.15); color: var(--green); }
    .event-badge.disconnected { background: rgba(239,68,68,0.15); color: var(--red); }
    .event-time { color: var(--text-dim); font-size: 12px; }
    .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 30px 10px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>📊 Today's Activity</h1>
    <a href="/" class="back-link">&larr; Back to map</a>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Distance Covered</div>
      <div class="kpi-value" id="kpiDistance">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Time Moving</div>
      <div class="kpi-value" id="kpiMoving">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">First Active</div>
      <div class="kpi-value" id="kpiFirst" style="font-size:15px;">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Last Active</div>
      <div class="kpi-value" id="kpiLast" style="font-size:15px;">—</div>
    </div>
  </div>

  <div class="section-title">Speed Over Time</div>
  <div class="chart-card">
    <canvas id="speedChart" height="160"></canvas>
  </div>

  <div class="section-title">Connection History</div>
  <div class="event-list" id="eventList">
    <div class="empty-state">Loading...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script>
    async function checkAuth() {
  if (localStorage.getItem("dashboardAuth") === "yes") return true;
  const pin = prompt("Enter dashboard PIN:");
  const res = await fetch("/api/verify-pin", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin }),
  });
  const data = await res.json();
  if (data.ok) { localStorage.setItem("dashboardAuth", "yes"); return true; }
  document.body.innerHTML = '<div class="empty-state" style="margin-top:40px;">Incorrect PIN. <a href="/dashboard.html" style="color:#60a5fa;">Try again</a></div>';
  return false;
}
    async function loadDashboard() {
      try {
        const [statsRes, logsRes, eventsRes] = await Promise.all([
          fetch("/api/stats"), fetch("/api/logs"), fetch("/api/events")
        ]);
        const stats = await statsRes.json();
        const logs = await logsRes.json();
        const events = await eventsRes.json();

        document.getElementById("kpiDistance").textContent = `${stats.totalDistanceKm} km`;
        document.getElementById("kpiMoving").textContent = `${stats.movingPercentage}%`;
        document.getElementById("kpiFirst").textContent = stats.firstSeen
          ? new Date(stats.firstSeen).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "No data yet";
        document.getElementById("kpiLast").textContent = stats.lastSeen
          ? new Date(stats.lastSeen).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "No data yet";

        const labels = logs.map(l => new Date(l.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        const speeds = logs.map(l => l.speedKmh);

        new Chart(document.getElementById("speedChart"), {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "Speed (km/h)", data: speeds,
              borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,0.15)",
              fill: true, tension: 0.3, pointRadius: 2,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: "#94a3b8", maxTicksLimit: 6 }, grid: { color: "rgba(255,255,255,0.05)" } },
              y: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(255,255,255,0.05)" }, beginAtZero: true },
            },
          },
        });

        const eventList = document.getElementById("eventList");
        if (events.length === 0) {
          eventList.innerHTML = '<div class="empty-state">No activity yet today.</div>';
        } else {
          eventList.innerHTML = events.map(e => {
            const icon = e.role === "driver" ? "🚌" : "🎫";
            const time = new Date(e.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            return `<div class="event-row">
              <div class="event-role">${icon} ${e.role.charAt(0).toUpperCase() + e.role.slice(1)}</div>
              <div class="event-badge ${e.event}">${e.event}</div>
              <div class="event-time">${time}</div>
            </div>`;
          }).join("");
        }
      } catch (err) {
        document.getElementById("eventList").innerHTML = `<div class="empty-state">Couldn't load data: ${err.message}</div>`;
      }
    }
    checkAuth().then(ok => { if (ok) loadDashboard(); });;
  </script>

</body>
</html>
